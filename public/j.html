<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Join a trip on TripSplit</title>
    <meta name="description" content="Open this link on a phone with TripSplit installed to join the trip." />
    <meta name="theme-color" content="#FEBB1B" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #febb1b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #171717;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: #febb1b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 21px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.5;
        color: #5f5f5f;
      }
      .code {
        display: block;
        margin: 0 0 20px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 6px;
        color: #171717;
      }
      .button {
        display: block;
        width: 100%;
        padding: 15px 20px;
        border: 0;
        border-radius: 14px;
        background: #171717;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .hint {
        margin: 16px 0 0;
        font-size: 13px;
        color: #7a7a7a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">✂️</div>
      <h1>Join this trip on TripSplit</h1>
      <p id="intro">Opening TripSplit…</p>
      <span class="code" id="code"></span>
      <a class="button" id="open" href="#">Open TripSplit</a>
      <p class="hint" id="hint">
        Nothing happens? Open TripSplit and tap the scan button, or type the code above on the
        Join a trip screen.
      </p>
    </main>

    <script>
      // The QR link looks like /j?code=AB12CD. The app understands this one:
      //   tripsplit:///trips/join?code=AB12CD
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = (params.get('code') || '').trim().toUpperCase();
        var codeEl = document.getElementById('code');
        var openEl = document.getElementById('open');
        var introEl = document.getElementById('intro');

        if (!code) {
          introEl.textContent = 'This link is missing its invite code.';
          openEl.style.display = 'none';
          return;
        }

        codeEl.textContent = code;

        var appLink = 'tripsplit:///trips/join?code=' + encodeURIComponent(code);
        openEl.setAttribute('href', appLink);

        // Try to open the app straight away. Coming back from the app (or a
        // browser that blocks this) leaves the page and its button in place.
        var jumped = false;
        function tryOpen() {
          if (jumped || document.hidden) return;
          jumped = true;
          window.location.href = appLink;
        }

        setTimeout(tryOpen, 250);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) jumped = true;
        });
      })();
    </script>
  </body>
</html>
