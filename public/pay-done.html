<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Back to TripSplit</title>
    <meta name="description" content="Return to TripSplit to finish your payment." />
    <meta name="theme-color" content="#FEBB1B" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #febb1b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #171717;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: #febb1b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 21px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.5;
        color: #5f5f5f;
      }
      .button {
        display: block;
        width: 100%;
        padding: 15px 20px;
        border: 0;
        border-radius: 14px;
        background: #171717;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .hint {
        margin: 16px 0 0;
        font-size: 13px;
        color: #7a7a7a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">✓</div>
      <h1 id="title">Back to TripSplit</h1>
      <p id="intro">Taking you back to the app…</p>
      <a class="button" id="open" href="tripsplit://paymongo-return">Open TripSplit</a>
      <p class="hint" id="hint">If the app does not open, tap the button above.</p>
    </main>

    <script>
      // PayMongo sends the payer here with ?result=paid or ?result=cancelled.
      // The app checks with the server what really happened, so this page only
      // hands control back.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var result = (params.get('result') || '').toLowerCase();
        if (result !== 'paid' && result !== 'cancelled') result = '';

        var title = document.getElementById('title');
        var intro = document.getElementById('intro');
        if (result === 'paid') {
          title.textContent = 'Payment sent';
          intro.textContent = 'Taking you back to TripSplit to record it…';
        } else if (result === 'cancelled') {
          document.querySelector('.mark').textContent = '↩';
          title.textContent = 'Payment not completed';
          intro.textContent = 'Nothing was charged. Taking you back to TripSplit…';
        }

        var query = result ? '?result=' + result : '';
        var appLink = 'tripsplit://paymongo-return' + query;
        // Chrome on Android opens apps more reliably through an intent link.
        var android = /android/i.test(navigator.userAgent);
        var link = android
          ? 'intent://paymongo-return' + query + '#Intent;scheme=tripsplit;end'
          : appLink;

        document.getElementById('open').setAttribute('href', link);

        // Jump straight away; the button stays for a browser that blocks it.
        window.location.replace(link);
      })();
    </script>
  </body>
</html>
